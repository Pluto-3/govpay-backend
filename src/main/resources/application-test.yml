spring:
  datasource:
    url: jdbc:h2:mem:govpay_test;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect

  flyway:
    enabled: false

  data:
    redis:
      host: localhost
      port: 6370   # different port, or use embedded

  rabbitmq:
    host: localhost
    port: 5672

govpay:
  jwt:
    secret: test-secret-key-that-is-long-enough-for-hmac-sha256-algorithm
    access-token-expiry-ms: 900000
    refresh-token-expiry-ms: 604800000