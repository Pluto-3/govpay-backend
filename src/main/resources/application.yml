spring:
  application:
    name: govpay-backend

  datasource:
    url: jdbc:postgresql://localhost:5432/govpay
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:REDACTED-PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
      idle-timeout: 600000

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        default_schema: public

  flyway:
    enabled: false
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 0
    out-of-order: false

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 2000ms

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    virtual-host: /
    listener:
      simple:
        auto-startup: false

server:
  port: 8080
  servlet:
    context-path: /api

govpay:
  jwt:
    secret: ${JWT_SECRET:your-256-bit-secret-key-change-in-production-must-be-long-enough}
    access-token-expiry-ms: 900000        # 15 minutes
    refresh-token-expiry-ms: 604800000    # 7 days

  notification:
    service-url: ${NOTIFICATION_SERVICE_URL:https://notification-service-4p41.onrender.com}

  rabbitmq:
    exchange: govpay.events
    queues:
      notification: govpay.notification.queue
      wallet-events: govpay.wallet.events.queue
    routing-keys:
      user-registered: user.registered
      kyc-status-changed: kyc.status.changed
      payment-completed: payment.completed
      payment-failed: payment.failed
      low-balance: wallet.low.balance
      bill-generated: bill.generated

  wallet:
    low-balance-threshold: 5000   # in smallest currency unit (cents/fils)
    max-top-up-amount: 10000000
    min-top-up-amount: 100

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized

logging:
  level:
    com.govpay: DEBUG
    org.springframework.security: INFO
    org.hibernate.SQL: INFO
    org.flywaydb: DEBUG